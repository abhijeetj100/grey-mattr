name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Needed to post the run-summary comment
      issues: write # Needed to post the run-summary comment
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Reads optional [model:x] and [effort:y] tags from the triggering text.
      # Untrusted text is passed via env (never interpolated into the script)
      # and only allowlisted values are emitted. Defaults: sonnet / medium.
      - name: Resolve model and effort
        id: cfg
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_TITLE: ${{ github.event_name == 'issues' && github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || '' }}
        run: |
          text="$(printf '%s\n%s\n%s\n%s' "$COMMENT_BODY" "$REVIEW_BODY" "$ISSUE_TITLE" "$ISSUE_BODY")"
          text="${text,,}"

          model_key="sonnet"
          effort="medium"

          if [[ "$text" =~ \[model:([a-z]+)\] ]]; then
            case "${BASH_REMATCH[1]}" in
              sonnet|opus|haiku) model_key="${BASH_REMATCH[1]}" ;;
            esac
          fi
          if [[ "$text" =~ \[effort:([a-z]+)\] ]]; then
            case "${BASH_REMATCH[1]}" in
              low|medium|high|xhigh|max) effort="${BASH_REMATCH[1]}" ;;
            esac
          fi

          # Pinned model IDs: upgrade deliberately by editing this table.
          case "$model_key" in
            sonnet) model="claude-sonnet-5-5" ;;
            opus)   model="claude-opus-5-5" ;;
            haiku)  model="claude-haiku-5-5" ;;
          esac

          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "Using model=$model effort=$effort"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Model and effort come from the parse step above (allowlisted values only).
          claude_args: '--model ${{ steps.cfg.outputs.model }} --effort ${{ steps.cfg.outputs.effort }}'

      # Posts model, effort, time, tokens and cost as a follow-up comment.
      - name: Post run summary
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL: ${{ steps.cfg.outputs.model }}
          EFFORT: ${{ steps.cfg.outputs.effort }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/claude-run-footer.sh
